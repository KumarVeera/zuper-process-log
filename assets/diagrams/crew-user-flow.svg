<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2300" width="1200" height="2300" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#111827;text-anchor:middle}
      .s{font-size:12px;fill:#4b5563;text-anchor:middle}
      .tw{font-size:15px;font-weight:600;fill:#ffffff;text-anchor:middle}
      .sw{font-size:12px;fill:#d1d5db;text-anchor:middle}
      .lbl{font-size:12px;font-weight:600;fill:#374151}
      .ln{fill:none;stroke:#374151;stroke-width:1.6}
      .screen{fill:#dbeafe;stroke:#1d4ed8;stroke-width:1.6}
      .user{fill:#ffffff;stroke:#374151;stroke-width:1.6}
      .sys{fill:#f3f4f6;stroke:#6b7280;stroke-width:1.6;stroke-dasharray:5 3}
      .dec{fill:#fef3c7;stroke:#b45309;stroke-width:1.6}
      .flag{fill:#ffedd5;stroke:#c2410c;stroke-width:1.6}
      .err{fill:#fee2e2;stroke:#b91c1c;stroke-width:1.6}
      .store{fill:#dcfce7;stroke:#15803d;stroke-width:1.6}
      .term{fill:#111827}
      .band{font-size:13px;font-weight:700;fill:#6b7280;letter-spacing:1px;text-anchor:middle}
      .mono{font-family:SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;fill:#111827}
    </style>
  </defs>

  <rect width="1200" height="2300" fill="#ffffff"/>

  <!-- Phase bands -->
  <rect x="0" y="110" width="1200" height="330" fill="#f8fafc"/>
  <rect x="0" y="800" width="1200" height="330" fill="#f8fafc"/>
  <rect x="0" y="1480" width="1200" height="820" fill="#f8fafc"/>
  <text class="band" transform="translate(1178,275) rotate(-90)">1 · REVIEW CHECKLIST</text>
  <text class="band" transform="translate(1178,620) rotate(-90)">2 · CAPTURE</text>
  <text class="band" transform="translate(1178,965) rotate(-90)">3 · PREVIEW QUALITY</text>
  <text class="band" transform="translate(1178,1305) rotate(-90)">4 · SAVE TO FOLDER</text>
  <text class="band" transform="translate(1178,1890) rotate(-90)">5 · FINISH &amp; SEND</text>

  <!-- Title -->
  <text x="40" y="52" font-size="22" font-weight="700" fill="#111827">Crew user flow</text>
  <text x="40" y="76" font-size="13" fill="#4b5563">Ravi (crew lead) · mobile app</text>
  <text x="40" y="94" font-size="13" fill="#4b5563">Checklist → capture → preview → folder → office</text>

  <!-- Legend -->
  <g transform="translate(830,24)">
    <rect width="300" height="270" rx="8" fill="#ffffff" stroke="#d1d5db"/>
    <text x="16" y="26" font-size="13" font-weight="700" fill="#111827">Legend</text>
    <rect x="16" y="40" width="44" height="22" rx="11" class="term"/><text x="72" y="56" font-size="12" fill="#111827">Start / end</text>
    <rect x="16" y="72" width="44" height="22" rx="4" class="screen"/><text x="72" y="88" font-size="12" fill="#111827">Screen</text>
    <rect x="16" y="104" width="44" height="22" rx="4" class="user"/><text x="72" y="120" font-size="12" fill="#111827">Crew action</text>
    <rect x="16" y="136" width="44" height="22" rx="4" class="sys"/><text x="72" y="152" font-size="12" fill="#111827">System (automatic)</text>
    <path d="M38,166 L60,179 L38,192 L16,179 z" class="dec"/><text x="72" y="184" font-size="12" fill="#111827">Decision</text>
    <rect x="16" y="200" width="44" height="22" rx="4" class="store"/><text x="72" y="216" font-size="12" fill="#111827">Saved file / folder</text>
    <rect x="16" y="232" width="20" height="22" rx="4" class="flag"/><rect x="40" y="232" width="20" height="22" rx="4" class="err"/><text x="72" y="248" font-size="12" fill="#111827">Flagged / recovery</text>
  </g>

  <!-- 1 Start -->
  <rect x="455" y="36" width="210" height="48" rx="24" class="term"/>
  <text x="560" y="57" class="tw">Arrive on site</text>
  <text x="560" y="74" class="sw">No signal on the roof</text>
  <line x1="560" y1="84" x2="560" y2="120" class="ln" marker-end="url(#arr)"/>

  <!-- 2 Today's jobs -->
  <rect x="430" y="122" width="260" height="56" rx="6" class="screen"/>
  <text x="560" y="146" class="t">Today's jobs</text>
  <text x="560" y="164" class="s">Tap "14 Elm St · Re-roof"</text>
  <line x1="560" y1="178" x2="560" y2="220" class="ln" marker-end="url(#arr)"/>

  <!-- 3 Checklist -->
  <rect x="430" y="222" width="260" height="56" rx="6" class="screen"/>
  <text x="560" y="246" class="t">Required photo checklist</text>
  <text x="560" y="264" class="s">Opens on BEFORE · 0 of 7 done</text>
  <line x1="560" y1="278" x2="560" y2="313" class="ln" marker-end="url(#arr)"/>

  <!-- 4 Can shot be taken? -->
  <path d="M560,315 L670,370 L560,425 L450,370 z" class="dec"/>
  <text x="560" y="366" class="t">Can this shot</text>
  <text x="560" y="384" class="t">be taken?</text>
  <line x1="670" y1="370" x2="788" y2="370" class="ln" marker-end="url(#arr)"/>
  <text x="716" y="362" class="lbl">No</text>
  <rect x="790" y="342" width="220" height="56" rx="6" class="flag"/>
  <text x="900" y="366" class="t">Skip with reason</text>
  <text x="900" y="384" class="s">Not accessible · unsafe · N/A</text>
  <line x1="900" y1="398" x2="900" y2="440" class="ln" marker-end="url(#arr)"/>
  <rect x="790" y="442" width="220" height="56" rx="6" class="sys"/>
  <text x="900" y="466" class="t">Marked SKIPPED</text>
  <text x="900" y="484" class="s">Reason saved · not "Done"</text>
  <path d="M900,498 V520 H1110 V1410 H672" class="ln" marker-end="url(#arr)"/>

  <line x1="560" y1="425" x2="560" y2="460" class="ln" marker-end="url(#arr)"/>
  <text x="570" y="448" class="lbl">Yes</text>

  <!-- 5 Next required shot -->
  <rect x="430" y="462" width="260" height="56" rx="6" class="user"/>
  <text x="560" y="486" class="t">Tap "Next required shot"</text>
  <text x="560" y="504" class="s">One tap · no browsing</text>
  <line x1="560" y1="518" x2="560" y2="550" class="ln" marker-end="url(#arr)"/>

  <!-- 6 Guided camera -->
  <rect x="430" y="552" width="260" height="56" rx="6" class="screen"/>
  <text x="560" y="576" class="t">Guided camera</text>
  <text x="560" y="594" class="s">Shot hint · time · GPS · offline chips</text>
  <line x1="560" y1="608" x2="560" y2="640" class="ln" marker-end="url(#arr)"/>

  <!-- 7 Capture -->
  <rect x="430" y="642" width="260" height="56" rx="6" class="user"/>
  <text x="560" y="666" class="t">Capture photo</text>
  <text x="560" y="684" class="s">Shutter or volume key · haptic</text>
  <line x1="560" y1="698" x2="560" y2="730" class="ln" marker-end="url(#arr)"/>

  <!-- 8 Auto stamp -->
  <rect x="430" y="732" width="260" height="56" rx="6" class="sys"/>
  <text x="560" y="756" class="t">Auto-stamp proof</text>
  <text x="560" y="774" class="s">Time · GPS · job ID · crew · file hash</text>
  <line x1="560" y1="788" x2="560" y2="820" class="ln" marker-end="url(#arr)"/>

  <!-- 9 Preview -->
  <rect x="430" y="822" width="260" height="56" rx="6" class="screen"/>
  <text x="560" y="846" class="t">Photo preview</text>
  <text x="560" y="864" class="s">On-device AI quality check</text>
  <line x1="560" y1="878" x2="560" y2="913" class="ln" marker-end="url(#arr)"/>

  <!-- 10 Quality OK? -->
  <path d="M560,915 L670,970 L560,1025 L450,970 z" class="dec"/>
  <text x="560" y="966" class="t">Quality</text>
  <text x="560" y="984" class="t">OK?</text>
  <line x1="450" y1="970" x2="312" y2="970" class="ln" marker-end="url(#arr)"/>
  <text x="362" y="962" class="lbl">No</text>
  <text x="381" y="990" font-size="11" fill="#6b7280" text-anchor="middle">blurry · dark ·</text>
  <text x="381" y="1004" font-size="11" fill="#6b7280" text-anchor="middle">wrong subject</text>

  <!-- Retake? -->
  <path d="M200,915 L310,970 L200,1025 L90,970 z" class="dec"/>
  <text x="200" y="975" class="t">Retake?</text>
  <path d="M200,915 V580 H428" class="ln" marker-end="url(#arr)"/>
  <text x="210" y="760" class="lbl">Yes</text>
  <line x1="200" y1="1025" x2="200" y2="1060" class="ln" marker-end="url(#arr)"/>
  <text x="210" y="1048" class="lbl">No</text>
  <rect x="90" y="1062" width="220" height="56" rx="6" class="flag"/>
  <text x="200" y="1086" class="t">Keep anyway</text>
  <text x="200" y="1104" class="s">AI never blocks · flagged</text>
  <line x1="310" y1="1090" x2="428" y2="1090" class="ln" marker-end="url(#arr)"/>

  <line x1="560" y1="1025" x2="560" y2="1060" class="ln" marker-end="url(#arr)"/>
  <text x="570" y="1048" class="lbl">Yes</text>

  <!-- 11 Keep -->
  <rect x="430" y="1062" width="260" height="56" rx="6" class="user"/>
  <text x="560" y="1086" class="t">Keep photo</text>
  <text x="560" y="1104" class="s">Rejected retakes kept for audit</text>
  <line x1="560" y1="1118" x2="560" y2="1150" class="ln" marker-end="url(#arr)"/>

  <!-- 12 Save to job folder (cylinder) -->
  <path d="M430,1162 A130,10 0 0,1 690,1162 V1222 A130,10 0 0,1 430,1222 Z" class="store"/>
  <path d="M430,1162 A130,10 0 0,0 690,1162" fill="none" stroke="#15803d" stroke-width="1.6"/>
  <text x="560" y="1194" class="t">Save to job folder (on phone)</text>
  <text x="560" y="1212" class="s">HR-2041 / Before / Front elevation</text>
  <line x1="560" y1="1232" x2="560" y2="1260" class="ln" marker-end="url(#arr)"/>

  <!-- Folder inset -->
  <line x1="690" y1="1192" x2="738" y2="1192" stroke="#15803d" stroke-width="1.4" stroke-dasharray="4 3"/>
  <g transform="translate(740,1130)">
    <rect width="330" height="196" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-dasharray="5 3"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#15803d">JOB FOLDER (same structure on phone + office)</text>
    <text x="14" y="46" class="mono">▾ HR-2041 · 14 Elm St</text>
    <text x="34" y="66" class="mono">▾ Before        1 of 7</text>
    <text x="58" y="86" class="mono">front-elevation_0912.jpg ✓</text>
    <text x="58" y="106" class="mono">gutters  · to do</text>
    <text x="34" y="126" class="mono">▸ During        0 of 4</text>
    <text x="34" y="146" class="mono">▸ After         0 of 7</text>
    <text x="34" y="166" class="mono">▸ Extra</text>
    <text x="14" y="186" font-size="11" fill="#4b5563">Each photo = original file + proof record</text>
  </g>

  <!-- 13 Checklist updated -->
  <rect x="430" y="1262" width="260" height="56" rx="6" class="sys"/>
  <text x="560" y="1286" class="t">Checklist updated</text>
  <text x="560" y="1304" class="s">Before 1 of 7 · "Saved on phone"</text>
  <line x1="560" y1="1318" x2="560" y2="1353" class="ln" marker-end="url(#arr)"/>

  <!-- 14 More required shots? -->
  <path d="M560,1355 L670,1410 L560,1465 L450,1410 z" class="dec"/>
  <text x="560" y="1406" class="t">More required</text>
  <text x="560" y="1424" class="t">shots?</text>
  <path d="M450,1410 H60 V490 H428" class="ln" marker-end="url(#arr)"/>
  <text x="300" y="1402" class="lbl">Yes · next shot</text>
  <text x="980" y="1402" class="lbl">from Skip</text>
  <line x1="560" y1="1465" x2="560" y2="1500" class="ln" marker-end="url(#arr)"/>
  <text x="570" y="1488" class="lbl">No · all phases done</text>

  <!-- 15 Finish summary -->
  <rect x="430" y="1502" width="260" height="56" rx="6" class="screen"/>
  <text x="560" y="1526" class="t">Finish job summary</text>
  <text x="560" y="1544" class="s">Done · Skipped · Missing by phase</text>
  <line x1="560" y1="1558" x2="560" y2="1593" class="ln" marker-end="url(#arr)"/>

  <!-- 16 Missing? -->
  <path d="M560,1595 L670,1650 L560,1705 L450,1650 z" class="dec"/>
  <text x="560" y="1646" class="t">Shots</text>
  <text x="560" y="1664" class="t">missing?</text>
  <line x1="670" y1="1650" x2="788" y2="1650" class="ln" marker-end="url(#arr)"/>
  <text x="716" y="1642" class="lbl">Yes</text>
  <rect x="790" y="1622" width="240" height="56" rx="6" class="flag"/>
  <text x="910" y="1646" class="t">Take now or add reason</text>
  <text x="910" y="1664" class="s">"Take now" returns to checklist</text>
  <path d="M910,1678 V1770 H692" class="ln" marker-end="url(#arr)"/>
  <line x1="560" y1="1705" x2="560" y2="1740" class="ln" marker-end="url(#arr)"/>
  <text x="570" y="1728" class="lbl">No</text>

  <!-- 17 Submit -->
  <rect x="430" y="1742" width="260" height="56" rx="6" class="user"/>
  <text x="560" y="1766" class="t">Submit job photos</text>
  <text x="560" y="1784" class="s">Sends job folder to the office</text>
  <line x1="560" y1="1798" x2="560" y2="1833" class="ln" marker-end="url(#arr)"/>

  <!-- 18 Online? -->
  <path d="M560,1835 L670,1890 L560,1945 L450,1890 z" class="dec"/>
  <text x="560" y="1895" class="t">Online?</text>
  <line x1="450" y1="1890" x2="312" y2="1890" class="ln" marker-end="url(#arr)"/>
  <text x="362" y="1882" class="lbl">No</text>
  <rect x="90" y="1862" width="220" height="56" rx="6" class="sys"/>
  <text x="200" y="1886" class="t">Queued on phone</text>
  <text x="200" y="1904" class="s">Offline is normal · nothing lost</text>
  <line x1="200" y1="1918" x2="200" y2="1980" class="ln" marker-end="url(#arr)"/>
  <rect x="90" y="1982" width="220" height="56" rx="6" class="sys"/>
  <text x="200" y="2006" class="t">Signal returns</text>
  <text x="200" y="2024" class="s">Upload starts by itself</text>
  <line x1="310" y1="2010" x2="428" y2="2010" class="ln" marker-end="url(#arr)"/>
  <line x1="560" y1="1945" x2="560" y2="1980" class="ln" marker-end="url(#arr)"/>
  <text x="570" y="1968" class="lbl">Yes</text>

  <!-- 19 Upload -->
  <rect x="430" y="1982" width="260" height="56" rx="6" class="sys"/>
  <text x="560" y="2006" class="t">Upload to office job folder</text>
  <text x="560" y="2024" class="s">Background · resumable</text>
  <line x1="560" y1="2038" x2="560" y2="2073" class="ln" marker-end="url(#arr)"/>

  <!-- 20 Confirmed? -->
  <path d="M560,2075 L670,2130 L560,2185 L450,2130 z" class="dec"/>
  <text x="560" y="2126" class="t">Server</text>
  <text x="560" y="2144" class="t">confirmed?</text>
  <line x1="670" y1="2130" x2="788" y2="2130" class="ln" marker-end="url(#arr)"/>
  <text x="716" y="2122" class="lbl">No</text>
  <rect x="790" y="2102" width="240" height="56" rx="6" class="err"/>
  <text x="910" y="2126" class="t">Auto-retry</text>
  <text x="910" y="2144" class="s">Photo stays on phone · Retry button</text>
  <path d="M910,2102 V2010 H692" class="ln" marker-end="url(#arr)"/>
  <line x1="560" y1="2185" x2="560" y2="2220" class="ln" marker-end="url(#arr)"/>
  <text x="570" y="2208" class="lbl">Yes</text>

  <!-- 21 End -->
  <rect x="420" y="2222" width="280" height="56" rx="28" class="term"/>
  <text x="560" y="2246" class="tw">All photos in office job folder ✓</text>
  <text x="560" y="2264" class="sw">Local copy released only now</text>
</svg>
